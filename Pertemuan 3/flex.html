<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: space-between;
        }
        .item {
            width: 150px;
            height: 150px;
            background-color: aqua;
            border-radius: 30px;
            display: flex;
            justify-content: center; 
            align-items: center;
        }
        h3 {
            text-align: center;
        }
        .container1 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: flex-start;
        }
       
        
        .container2 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
     
        
        .container3 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: flex-end;
        }
        .container4 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }
        .container5 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: space-evenly;
        }
        .container6 {
            width: 800px;
            height: 400px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: space-evenly;
            gap: 30px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h3>justify-content: Flex-start</h3>
    <div class="container1">
        
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>justify-content: center</h3>
    <div class="container2">
        
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>justify-content: flex-end</h3>
    <div class="container3">
        
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>justify-content: space between</h3>
    <div class="container">
        
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>justify-content: space around</h3>
    <div class="container4">
        
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>justify-content: space evenly</h3>
    <div class="container5">
        
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>Gap & Flex-warp</h3>
    <div class="container6">
        
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
    </div>
</body>
</html>
